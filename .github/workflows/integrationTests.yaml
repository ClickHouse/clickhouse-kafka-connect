name: Integration Tests

on:
  schedule:
    - cron: "00 03 * * *"
  workflow_dispatch:

# note: LTS releases and latest stable builds can be found here: https://github.com/ClickHouse/ClickHouse/pulls?q=is%3Aopen+is%3Apr+label%3Arelease
jobs:
  build-and-run-cloud:
    runs-on: ubuntu-latest
    name: Kafka Connect integration tests against ClickHouse cloud
    # These tests stop and start one dedicated ClickHouse Cloud service: never let two runs touch it at once.
    concurrency:
      group: integration-tests-cloud-service
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
#      NOTE: since cloud integration tests restart the cloud service, run V1 and V2 tests sequentially
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Execute Gradle 'integrationTest' task - Client version V1
        env:
          CLICKHOUSE_VERSION: cloud
          CLIENT_VERSION: V1
          IT_CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          IT_CLICKHOUSE_PORT: ${{ vars.CLICKHOUSE_PORT }}
          IT_CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          IT_CLOUD_ORGANIZATION: ${{ vars.CLICKHOUSE_CLOUD_ORGANIZATION }}
          IT_CLOUD_API_KEY: ${{ vars.CLICKHOUSE_CLOUD_API_KEY }}
          IT_CLOUD_SECRET: ${{ secrets.CLICKHOUSE_CLOUD_SECRET }}
          IT_CLOUD_SERVICE_ID: ${{ vars.CLICKHOUSE_CLOUD_SERVICE_ID }}
          IT_CLOUD_API_HOST: ${{ vars.CLICKHOUSE_CLOUD_API_HOST }}
        run: |
          ./gradlew integrationTest \
            --tests "com.clickhouse.kafka.connect.sink.ClickHouseCloudTest" \
            --tests "com.clickhouse.kafka.connect.sink.ExactlyOnceTest" \
            -Dclickhouse.host="$IT_CLICKHOUSE_HOST" \
            -Dclickhouse.port="$IT_CLICKHOUSE_PORT" \
            -Dclickhouse.password="$IT_CLICKHOUSE_PASSWORD" \
            -Dclickhouse.cloud.organization="$IT_CLOUD_ORGANIZATION" \
            -Dclickhouse.cloud.apiKey="$IT_CLOUD_API_KEY" \
            -Dclickhouse.cloud.secret="$IT_CLOUD_SECRET" \
            -Dclickhouse.cloud.serviceId="$IT_CLOUD_SERVICE_ID" \
            -Dclickhouse.cloud.host="$IT_CLOUD_API_HOST"
      - name: Execute Gradle 'integrationTest' task - Client version V2
        env:
          CLICKHOUSE_VERSION: cloud
          CLIENT_VERSION: V2
          IT_CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          IT_CLICKHOUSE_PORT: ${{ vars.CLICKHOUSE_PORT }}
          IT_CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          IT_CLOUD_ORGANIZATION: ${{ vars.CLICKHOUSE_CLOUD_ORGANIZATION }}
          IT_CLOUD_API_KEY: ${{ vars.CLICKHOUSE_CLOUD_API_KEY }}
          IT_CLOUD_SECRET: ${{ secrets.CLICKHOUSE_CLOUD_SECRET }}
          IT_CLOUD_SERVICE_ID: ${{ vars.CLICKHOUSE_CLOUD_SERVICE_ID }}
          IT_CLOUD_API_HOST: ${{ vars.CLICKHOUSE_CLOUD_API_HOST }}
        run: |
          ./gradlew integrationTest \
            --tests "com.clickhouse.kafka.connect.sink.ClickHouseCloudTest" \
            --tests "com.clickhouse.kafka.connect.sink.ExactlyOnceTest" \
            -Dclickhouse.host="$IT_CLICKHOUSE_HOST" \
            -Dclickhouse.port="$IT_CLICKHOUSE_PORT" \
            -Dclickhouse.password="$IT_CLICKHOUSE_PASSWORD" \
            -Dclickhouse.cloud.organization="$IT_CLOUD_ORGANIZATION" \
            -Dclickhouse.cloud.apiKey="$IT_CLOUD_API_KEY" \
            -Dclickhouse.cloud.secret="$IT_CLOUD_SECRET" \
            -Dclickhouse.cloud.serviceId="$IT_CLOUD_SERVICE_ID" \
            -Dclickhouse.cloud.host="$IT_CLOUD_API_HOST"
  build-and-run-standalone:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [ "V1", "V2" ]
        clickhouse: [ "25.3", "25.8", "25.10", "25.11", "25.12", "latest", "head" ]
    name: Kafka Connect integration tests against standalone ClickHouse ${{ matrix.clickhouse }} Client version ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Execute Gradle 'integrationTest' task
        env:
          CLICKHOUSE_VERSION: ${{ matrix.clickhouse }}
          CLIENT_VERSION: ${{ matrix.client }}
        run: |
          ./gradlew integrationTest \
            --tests "com.clickhouse.kafka.connect.sink.ClickHouseSinkConnectorIntegrationTest"
  build-and-run-cluster:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [ "V1", "V2" ]
        clickhouse: [ "25.3", "25.8", "25.10", "25.11", "25.12", "latest", "head" ]
        cluster_name: [ "three_shards_one_replica_each", "one_shard_three_replicas" ]
    name: Kafka Connect integration tests against cluster ${{ matrix.cluster_name }} ClickHouse ${{ matrix.clickhouse }} Client version ${{ matrix.client }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Execute Gradle 'integrationTest' task
        env:
          CLICKHOUSE_VERSION: ${{ matrix.clickhouse }}
          CLIENT_VERSION: ${{ matrix.client }}
          CLICKHOUSE_CLUSTER_NAME: ${{ matrix.cluster_name }}
        run: |
          ./gradlew integrationTest \
            --tests "com.clickhouse.kafka.connect.sink.ClickHouseSinkConnectorIntegrationTest" \
            --tests "com.clickhouse.kafka.connect.sink.ExactlyOnceTest"
